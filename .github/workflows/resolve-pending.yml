name: Resolve Pending Adzuna Replies

# Companion to job-pipeline.yml. Some Adzuna jobs need a real, non-automated
# click to get past their redirect (or an Adzuna account login this project
# will never automate) — apply_notifier.py asks you to reply on Telegram
# with the real URL once you've opened it yourself. This workflow polls for
# that reply on a short interval (independent of the once-a-day main run,
# since you might reply at any time) and finishes the application using the
# same Greenhouse/Lever auto-apply logic as the main pipeline.
#
# Uses the same repo secrets as job-pipeline.yml — no extra setup needed.

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write   # needed to dispatch job-pipeline.yml on a Telegram "run" trigger

jobs:
  resolve-pending:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apply_agent/requirements.txt
          playwright install --with-deps chromium

      - name: Write keys.json from secrets
        run: |
          cat > keys.json <<'EOF'
          {
            "ANTHROPIC_API_KEY": "${{ secrets.ANTHROPIC_API_KEY }}",
            "GMAIL_ADDRESS": "${{ secrets.GMAIL_ADDRESS }}",
            "GMAIL_APP_PASSWORD": "${{ secrets.GMAIL_APP_PASSWORD }}",
            "DIGEST_TO": "${{ secrets.DIGEST_TO }}",
            "TELEGRAM_BOT_TOKEN": "${{ secrets.TELEGRAM_BOT_TOKEN }}",
            "TELEGRAM_CHAT_ID": "${{ secrets.TELEGRAM_CHAT_ID }}"
          }
          EOF

      - name: Resolve any pending Adzuna replies / check for a Telegram trigger
        id: resolve
        working-directory: apply_agent
        run: |
          xvfb-run -a python3 resolve_pending.py --profile ../profile.json

      - name: Dispatch job-pipeline.yml if a "run" message came in on Telegram
        if: steps.resolve.outputs.trigger_pipeline == 'true'
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/job-pipeline.yml/dispatches" \
            -d '{"ref":"${{ github.ref_name }}"}'

      - name: Commit dedup state back to the repo
        run: |
          git config user.name "job-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apply_agent/state 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Resolve pending run: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push || true
