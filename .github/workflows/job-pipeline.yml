name: Job Search Pipeline

# Runs the full pipeline in the cloud, on a schedule, so it no longer needs
# your Mac running. Each run: fetch -> filter/score -> tailor resume+cover
# letter -> auto-apply (Greenhouse forms only, never on a CAPTCHA-gated one)
# -> email you anything left over (tagged [JobAgent]) for manual apply.
#
# Auto-apply escalates screening questions it can't answer from your resume
# to Telegram and waits (bounded) for your reply, if TELEGRAM_* secrets are
# set; without them it just falls back to the manual-email flow for those.
#
# One-time setup (see SETUP.md in this folder for the full walkthrough):
#   1. Push this repo to GitHub (you're doing this part).
#   2. Add these as repo secrets (Settings -> Secrets and variables -> Actions):
#        ADZUNA_APP_ID, ADZUNA_APP_KEY, RAPIDAPI_KEY, MUSE_API_KEY,
#        ANTHROPIC_API_KEY, GMAIL_ADDRESS, GMAIL_APP_PASSWORD, DIGEST_TO,
#        TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID (optional, for screening-question escalation)
#        VPS_HOST, VPS_SSH_KEY, VPS_NOVNC_URL, VPS_NOVNC_PASSWORD (optional, for the
#        CAPTCHA remote-browser hand-off — without these, a CAPTCHA just falls back
#        to the old "captcha" status, unchanged)
#   3. (Optional) adjust the cron schedule below and JOB_QUERY/JOB_LOCATION.

on:
  # No cron for now (2026-09, Rohit's request) — auto-apply is still being
  # validated (Greenhouse blank-form fix, Apify source switch), so runs are
  # manual only: click "Run workflow" in the GitHub UI, or send "run" to the
  # Telegram bot (telegram-trigger.yml polls for that and dispatches this
  # workflow — see its own comments). Re-add a schedule once auto-apply is
  # trusted; the old RapidAPI-quota-driven weekly cadence no longer applies
  # now that the sole source is Apify (pay-per-result, no monthly cap).
  workflow_dispatch: {}     # lets you click "Run workflow" manually in the GitHub UI,
                             # or via telegram-trigger.yml's API call on a Telegram "run" message

permissions:
  contents: write   # needed to commit state/output back so re-runs don't duplicate

env:
  # Single query — Active Jobs DB's free tier is 25 requests/month and
  # job_search.py calls the source once per JOB_QUERY entry, so more than
  # one query here multiplies straight into the quota.
  JOB_QUERY: "data engineer"
  JOB_LOCATION: "United States"
  WINDOW_MIN: "10080"         # look back 7d — matches the weekly cadence
  MIN_SALARY: "160000"
  MIN_SCORE: "70"
  TOP: "10"
  REMOTE_ONLY: "true"         # drop anything not tagged remote (Active Jobs DB's
                               # ai_work_arrangement=Remote OK/Remote Solely)

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies for all stages
        run: |
          python -m pip install --upgrade pip
          pip install -r job_Search/requirements.txt
          pip install -r job_filter_agent/requirements.txt
          pip install -r resume_creation_agent/requirements.txt
          pip install -r apply_agent/requirements.txt
          playwright install --with-deps chromium

      - name: Write keys.json from secrets
        run: |
          cat > keys.json <<'EOF'
          {
            "ADZUNA_APP_ID": "${{ secrets.ADZUNA_APP_ID }}",
            "ADZUNA_APP_KEY": "${{ secrets.ADZUNA_APP_KEY }}",
            "RAPIDAPI_KEY": "${{ secrets.RAPIDAPI_KEY }}",
            "APIFY_TOKEN": "${{ secrets.APIFY_TOKEN }}",
            "MUSE_API_KEY": "${{ secrets.MUSE_API_KEY }}",
            "ANTHROPIC_API_KEY": "${{ secrets.ANTHROPIC_API_KEY }}",
            "GMAIL_ADDRESS": "${{ secrets.GMAIL_ADDRESS }}",
            "GMAIL_APP_PASSWORD": "${{ secrets.GMAIL_APP_PASSWORD }}",
            "DIGEST_TO": "${{ secrets.DIGEST_TO }}",
            "TELEGRAM_BOT_TOKEN": "${{ secrets.TELEGRAM_BOT_TOKEN }}",
            "TELEGRAM_CHAT_ID": "${{ secrets.TELEGRAM_CHAT_ID }}"
          }
          EOF

      - name: Stage 1 — fetch jobs
        working-directory: job_Search
        run: |
          # REMOTE_ONLY / JOB_QUERY / JOB_LOCATION are picked up straight from
          # the environment (env_flag()/cfg() in job_search.py) -- no matching
          # CLI flag needed here.
          python3 job_search.py \
            --window-min "$WINDOW_MIN" \
            --min-salary "$MIN_SALARY" \
            --json-out jobs.json \
            --no-email

      - name: Stage 2 — filter + score
        working-directory: job_filter_agent
        run: |
          python3 filter_agent.py \
            --jobs ../job_Search/jobs.json \
            --min-score "$MIN_SCORE" \
            --scored-out scored.json \
            --any-company \
            --no-email

      - name: Stage 3 — tailor resume + cover letter
        working-directory: resume_creation_agent
        run: |
          # --regenerate: output/ is gitignored and never persists between
          # runs, so resume_agent's own "already done" state would otherwise
          # skip regenerating a file that doesn't actually exist this run.
          # filter_agent's scored.json is already new-jobs-only, so this is
          # safe and not wasted work.
          python3 resume_agent.py \
            --scored ../job_filter_agent/scored.json \
            --min-score "$MIN_SCORE" \
            --top "$TOP" \
            --regenerate

      - name: Set up VPS SSH key (for the CAPTCHA remote-browser hand-off)
        if: ${{ secrets.VPS_HOST != '' }}
        run: |
          mkdir -p ~/.ssh
          cat > ~/.ssh/vps_key <<'EOF'
          ${{ secrets.VPS_SSH_KEY }}
          EOF
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Open SSH tunnel to the VPS browser's CDP port
        if: ${{ secrets.VPS_HOST != '' }}
        run: |
          # Backgrounded (-f) and never dies with this step — stays open for
          # the rest of the job so Stage 4 can reach the VPS's Chromium at
          # localhost:9222. The VPS's own CDP port is bound to 127.0.0.1
          # there and is never exposed publicly; this tunnel is the only way
          # in, over SSH.
          ssh -f -N -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
            -i ~/.ssh/vps_key -L 9222:127.0.0.1:9222 \
            ubuntu@${{ secrets.VPS_HOST }}
          sleep 2
          curl -sf http://localhost:9222/json/version || echo "  [vps-tunnel] warm-up check failed (non-fatal — auto_apply.py falls back to plain 'captcha' status if the VPS is unreachable)"

      - name: Stage 4 — auto-apply (Greenhouse only, CAPTCHA-safe)
        working-directory: apply_agent
        env:
          # Unset (empty secrets) unless VPS_HOST is configured — this is the
          # opt-in switch escalate_to_remote_browser() checks. When empty, a
          # CAPTCHA just falls back to the original "captcha" status exactly
          # as before this feature existed.
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY_PATH: /home/runner/.ssh/vps_key  # ubuntu-latest's default HOME
          VPS_SSH_USER: ubuntu
          VPS_NOVNC_URL: ${{ secrets.VPS_NOVNC_URL }}
          VPS_NOVNC_PASSWORD: ${{ secrets.VPS_NOVNC_PASSWORD }}
        run: |
          # xvfb-run + a headed browser: Adzuna's own /land/ad/... redirect
          # page does a client-side JS redirect that doesn't fire for headless
          # Chromium (fingerprint-based anti-scraping on their end) — a real,
          # headed browser rendering under a virtual display gets past it.
          xvfb-run -a python3 auto_apply.py \
            --scored ../job_filter_agent/scored.json \
            --resumes ../resume_creation_agent/output \
            --profile ../profile.json \
            --min-score "$MIN_SCORE" \
            --top "$TOP"

      - name: Stage 5 — email you anything not auto-applied
        working-directory: apply_agent
        run: |
          python3 apply_notifier.py \
            --scored ../job_filter_agent/scored.json \
            --resumes ../resume_creation_agent/output \
            --min-score "$MIN_SCORE" \
            --top "$TOP"

      - name: Commit dedup state back to the repo
        run: |
          git config user.name "job-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add job_Search/state job_filter_agent/state \
                  resume_creation_agent/state apply_agent/state \
                  apply_agent/state/applied.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Job agent run: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push || true
