name: Job Search Pipeline

# Runs the full pipeline in the cloud, on a schedule, so it no longer needs
# your Mac running. Each run: fetch -> filter/score -> tailor resume+cover
# letter -> email you the application package (tagged [JobAgent]).
#
# One-time setup (see SETUP.md in this folder for the full walkthrough):
#   1. Push this repo to GitHub (you're doing this part).
#   2. Add these as repo secrets (Settings -> Secrets and variables -> Actions):
#        ADZUNA_APP_ID, ADZUNA_APP_KEY, RAPIDAPI_KEY, MUSE_API_KEY,
#        ANTHROPIC_API_KEY, GMAIL_ADDRESS, GMAIL_APP_PASSWORD, DIGEST_TO
#   3. (Optional) adjust the cron schedule below and JOB_QUERY/JOB_LOCATION.

on:
  schedule:
    - cron: "0 13 * * *"   # 13:00 UTC daily — adjust to your timezone
  workflow_dispatch: {}     # lets you click "Run workflow" manually in the GitHub UI

permissions:
  contents: write   # needed to commit state/output back so re-runs don't duplicate

env:
  JOB_QUERY: "data engineer,analytics engineer,etl developer,data platform engineer,BI engineer,data architect,senior data engineer"
  JOB_LOCATION: "United States"
  WINDOW_MIN: "1440"          # look back 24h since this runs daily
  MIN_SALARY: "160000"
  MIN_SCORE: "70"
  TOP: "10"

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies for all stages
        run: |
          python -m pip install --upgrade pip
          pip install -r job_Search/requirements.txt
          pip install -r job_filter_agent/requirements.txt
          pip install -r resume_creation_agent/requirements.txt
          pip install -r apply_agent/requirements.txt

      - name: Write keys.json from secrets
        run: |
          cat > keys.json <<'EOF'
          {
            "ADZUNA_APP_ID": "${{ secrets.ADZUNA_APP_ID }}",
            "ADZUNA_APP_KEY": "${{ secrets.ADZUNA_APP_KEY }}",
            "RAPIDAPI_KEY": "${{ secrets.RAPIDAPI_KEY }}",
            "MUSE_API_KEY": "${{ secrets.MUSE_API_KEY }}",
            "ANTHROPIC_API_KEY": "${{ secrets.ANTHROPIC_API_KEY }}",
            "GMAIL_ADDRESS": "${{ secrets.GMAIL_ADDRESS }}",
            "GMAIL_APP_PASSWORD": "${{ secrets.GMAIL_APP_PASSWORD }}",
            "DIGEST_TO": "${{ secrets.DIGEST_TO }}"
          }
          EOF

      - name: Stage 1 — fetch jobs
        working-directory: job_Search
        run: |
          python3 job_search.py \
            --window-min "$WINDOW_MIN" \
            --min-salary "$MIN_SALARY" \
            --json-out jobs.json \
            --no-email

      - name: Stage 2 — filter + score
        working-directory: job_filter_agent
        run: |
          python3 filter_agent.py \
            --jobs ../job_Search/jobs.json \
            --min-score "$MIN_SCORE" \
            --scored-out scored.json \
            --any-company \
            --no-email

      - name: Stage 3 — tailor resume + cover letter
        working-directory: resume_creation_agent
        run: |
          python3 resume_agent.py \
            --scored ../job_filter_agent/scored.json \
            --min-score "$MIN_SCORE" \
            --top "$TOP"

      - name: Stage 4 — email you the application package
        working-directory: apply_agent
        run: |
          python3 apply_notifier.py \
            --scored ../job_filter_agent/scored.json \
            --resumes ../resume_creation_agent/output \
            --min-score "$MIN_SCORE" \
            --top "$TOP"

      - name: Commit dedup state back to the repo
        run: |
          git config user.name "job-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add job_Search/state job_filter_agent/state \
                  resume_creation_agent/state apply_agent/state 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Job agent run: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push || true
